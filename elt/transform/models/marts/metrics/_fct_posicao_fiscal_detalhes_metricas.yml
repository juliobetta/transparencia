version: 2

models:
  - name: fct_posicao_fiscal_detalhes_metricas
    description: "Mart de detalhes de restos a pagar e credores por portal, entidade e exercício"
    config:
      contract:
        enforced: true
    columns:
      - name: posicao_fiscal_detalhes_id
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: administracao
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: valor_pendente
        data_type: numeric
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: fornecedor_nome
        data_type: text
        tests:
          - not_null

unit_tests:
  - name: test_posicao_fiscal_detalhes_metricas_restos_e_credor
    description: "Valida a construção de restos pendentes e ranking de credores a partir do mart de despesas"
    model: fct_posicao_fiscal_detalhes_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, fonte: "restos_a_pagar", descricao: "Fornecedor A", empenhado: 100000.00, pago: 30000.00 }
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2099, fonte: "restos_a_pagar", descricao: "Fornecedor D", empenhado: 80000.00, pago: 10000.00 }
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2026, fonte: "restos_a_pagar", descricao: "Fornecedor E", empenhado: 90000.00, pago: 0.00 }
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2024, fonte: "restos_a_pagar", descricao: "Fornecedor B", empenhado: 50000.00, pago: 10000.00 }
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, fonte: "despesa_normal", descricao: "Fornecedor C", empenhado: 1000.00, pago: 500.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, administracao: "Adm. Atual", valor_pendente: 70000.00, fornecedor_nome: "Fornecedor A" }
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2026, administracao: "Adm. Atual", valor_pendente: 90000.00, fornecedor_nome: "Fornecedor E" }
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2024, administracao: "Adm. Anterior", valor_pendente: 40000.00, fornecedor_nome: "Fornecedor B" }
