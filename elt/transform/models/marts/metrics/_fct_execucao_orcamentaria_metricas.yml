version: 2

models:
  - name: fct_execucao_orcamentaria_metricas
    description: "Mart de métricas agregadas de execução orçamentária por portal, entidade, ano, órgão, unidade, função e subfunção"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.expression_is_true:
          expression: "total_empenhado >= total_liquidado AND total_liquidado >= total_pago"
          name: execucao_orcamentaria_invariante_lrf
    columns:
      - name: execucao_orcamentaria_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | empresa_id | ano | orgao_codigo | unidade_codigo | funcao_codigo | subfuncao_codigo)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        description: "Identificador da entidade/órgão contábil"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: orgao_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código do órgão orçamentário"
        tests:
          - not_null
      - name: orgao_nome
        data_type: text
        description: "Nome do órgão contábil/unidade gestora"
      - name: unidade_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código da unidade orçamentária"
        tests:
          - not_null
      - name: funcao_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código da função orçamentária"
        tests:
          - not_null
      - name: subfuncao_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código da subfunção orçamentária"
        tests:
          - not_null
      - name: total_dotacao_atualizada
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de dotação atualizada no agrupamento"
        tests:
          - not_null
      - name: total_empenhado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores empenhados no agrupamento"
        tests:
          - not_null
      - name: total_liquidado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores liquidados no agrupamento"
        tests:
          - not_null
      - name: total_pago
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores pagos no agrupamento"
        tests:
          - not_null
      - name: saldo_orcamentario
        data_type: numeric
        constraints:
          - type: not_null
        description: "Saldo orçamentário (dotação atualizada - total empenhado)"
        tests:
          - not_null
      - name: taxa_execucao
        data_type: numeric
        constraints:
          - type: not_null
        description: "Taxa de execução orçamentária (empenhado / dotação)"
        tests:
          - not_null
      - name: alerta_execucao
        data_type: text
        constraints:
          - type: not_null
        description: "Indicador de alerta de execução (baixa, excesso, normal, N/D)"
        tests:
          - not_null

unit_tests:
  - name: test_execucao_orcamentaria_metricas_calculos
    description: "Valida se saldo_orcamentario, taxa_execucao, alerta_execucao e orgao_nome são calculados corretamente a partir de fct_despesas_por_orgao"
    model: fct_execucao_orcamentaria_metricas
    given:
      - input: ref('fct_despesas_por_orgao')
        rows:
          - { empresa: "1", ano: 2025, codigo: "02", descricao: "SECRETARIA MUNICIPAL DE ADMINISTRACAO", dotacao_atualizada: 100000.00, empenhado: 60000.00, liquidado: 50000.00, pago: 40000.00 }
          - { empresa: "1", ano: 2025, codigo: "02", descricao: "SECRETARIA MUNICIPAL DE ADMINISTRACAO", dotacao_atualizada: 50000.00, empenhado: 0.00, liquidado: 0.00, pago: 0.00 }
          - { empresa: "1", ano: 2025, codigo: "03", descricao: "FUNDO MUNICIPAL DE SAUDE", dotacao_atualizada: 100000.00, empenhado: 20000.00, liquidado: 15000.00, pago: 10000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, orgao_codigo: "02", orgao_nome: "SECRETARIA MUNICIPAL DE ADMINISTRACAO", unidade_codigo: "00", funcao_codigo: "00", subfuncao_codigo: "00", total_dotacao_atualizada: 150000.00, total_empenhado: 60000.00, total_liquidado: 50000.00, total_pago: 40000.00, saldo_orcamentario: 90000.00, taxa_execucao: 0.4000, alerta_execucao: "normal" }
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, orgao_codigo: "03", orgao_nome: "FUNDO MUNICIPAL DE SAUDE", unidade_codigo: "00", funcao_codigo: "00", subfuncao_codigo: "00", total_dotacao_atualizada: 100000.00, total_empenhado: 20000.00, total_liquidado: 15000.00, total_pago: 10000.00, saldo_orcamentario: 80000.00, taxa_execucao: 0.2000, alerta_execucao: "baixa" }
