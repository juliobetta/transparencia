version: 2

models:
  - name: fct_posicao_fiscal_metricas
    description: "Mart de métricas agregadas de posição fiscal diária e anual por portal, entidade e exercício"
    config:
      contract:
        enforced: true
    columns:
      - name: posicao_fiscal_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | empresa_id | ano)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        description: "Identificador da entidade/órgão (ex: Prefeitura, Fundo de Saúde)"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: total_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Total de receitas arrecadadas no exercício"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: despesas_pagas
        data_type: numeric
        constraints:
          - type: not_null
        description: "Total de despesas orçamentárias pagas no ano"
        tests:
          - not_null
      - name: restos_pagos_no_ano
        data_type: numeric
        constraints:
          - type: not_null
        description: "Restos a pagar liquidados e pagos no ano de referência"
        tests:
          - not_null
      - name: restos_pendentes_adm_anterior
        data_type: numeric
        constraints:
          - type: not_null
        description: "Saldo pendente de restos a pagar referente a gestões anteriores"
        tests:
          - not_null
      - name: restos_pendentes_adm_atual
        data_type: numeric
        constraints:
          - type: not_null
        description: "Saldo pendente de restos a pagar da gestão atual"
        tests:
          - not_null
      - name: saldo_estimado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Saldo estimado calculado como total_arrecadado - (despesas_pagas + restos_pagos_no_ano)"
        tests:
          - not_null
