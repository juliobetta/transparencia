version: 2

models:
  - name: fct_fontes_receita_metricas
    description: "Mart de métricas agregadas de fontes de receita e transferências por portal e ano"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.expression_is_true:
          expression: "total_arrecadado >= 0"
          name: fontes_receita_invariante_arrecadado
    columns:
      - name: fontes_receita_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | ano)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: receita_propria_previsto
        data_type: numeric
        constraints:
          - type: not_null
        description: "Previsão de receita própria municipal"
        tests:
          - not_null
      - name: receita_propria_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação de receita própria municipal"
        tests:
          - not_null
      - name: transferencias_uniao_previsto
        data_type: numeric
        constraints:
          - type: not_null
        description: "Previsão de transferências da União"
        tests:
          - not_null
      - name: transferencias_uniao_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação de transferências da União"
        tests:
          - not_null
      - name: transferencias_estado_previsto
        data_type: numeric
        constraints:
          - type: not_null
        description: "Previsão de transferências do Estado"
        tests:
          - not_null
      - name: transferencias_estado_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação de transferências do Estado"
        tests:
          - not_null
      - name: total_previsto
        data_type: numeric
        constraints:
          - type: not_null
        description: "Previsão total de receitas orçamentárias"
        tests:
          - not_null
      - name: total_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação total de receitas orçamentárias"
        tests:
          - not_null
      - name: pct_propria
        data_type: numeric
        constraints:
          - type: not_null
        description: "Percentual da receita própria em relação ao total"
        tests:
          - not_null
      - name: alerta_dependencia
        data_type: boolean
        constraints:
          - type: not_null
        description: "Flag de alerta de dependência financeira (true se pct_propria < 10%)"
        tests:
          - not_null
      - name: fpm_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação específica do Fundo de Participação dos Municípios (FPM)"
        tests:
          - not_null
      - name: icms_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação específica do ICMS"
        tests:
          - not_null
      - name: iss_iptu_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação específica de tributos municipais (ISS/IPTU)"
        tests:
          - not_null
      - name: emendas_pix_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação de transferências especiais / Emendas Pix"
        tests:
          - not_null
      - name: emendas_individuais_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Arrecadação de emendas parlamentares individuais"
        tests:
          - not_null
      - name: emendas_total_arrecadado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório total de arrecadação de emendas"
        tests:
          - not_null

unit_tests:
  - name: test_fontes_receita_metricas_calculos
    description: "Valida se receitas próprias, percentual e alertas de dependência são calculados corretamente"
    model: fct_fontes_receita_metricas
    given:
      - input: ref('fct_receitas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, tipo_receita: "orcamentaria", codigo: "1.1.1.8.01.1", descricao: "IPTU PROPRIO", previsao_atualizada: 100000.00, arrecadado: 80000.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, tipo_receita: "uniao", codigo: "1.7.1.8.01.2", descricao: "FPM UNIAO", previsao_atualizada: 500000.00, arrecadado: 450000.00 }
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, tipo_receita: "estado", codigo: "1.7.2.8.01.1", descricao: "ICMS ESTADO", previsao_atualizada: 400000.00, arrecadado: 350000.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2025, receita_propria_previsto: 100000.00, receita_propria_arrecadado: 80000.00, transferencias_uniao_previsto: 500000.00, transferencias_uniao_arrecadado: 450000.00, transferencias_estado_previsto: 400000.00, transferencias_estado_arrecadado: 350000.00, total_previsto: 1000000.00, total_arrecadado: 880000.00, pct_propria: 9.0909, alerta_dependencia: true, fpm_arrecadado: 450000.00, icms_arrecadado: 350000.00, iss_iptu_arrecadado: 80000.00, emendas_pix_arrecadado: 0.00, emendas_individuais_arrecadado: 0.00, emendas_total_arrecadado: 0.00 }
