version: 2

models:
  - name: fct_despesas_diarias_metricas
    description: "Mart de métricas de diárias agregadas por portal, entidade, exercício, favorecido e cargo"
    config:
      contract:
        enforced: true
    columns:
      - name: diarias_metricas_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | empresa_id | ano | favorecido | cargo)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        description: "Identificador da entidade contábil"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: favorecido
        data_type: text
        constraints:
          - type: not_null
        description: "Nome do beneficiário ou __TOTAL__"
        tests:
          - not_null
      - name: cargo
        data_type: text
        constraints:
          - type: not_null
        description: "Cargo do beneficiário ou __TOTAL__"
        tests:
          - not_null
      - name: total_valor
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total de diárias concedidas"
        tests:
          - not_null
      - name: qtd_concessoes
        data_type: integer
        constraints:
          - type: not_null
        description: "Quantidade de concessões de diárias"
        tests:
          - not_null
