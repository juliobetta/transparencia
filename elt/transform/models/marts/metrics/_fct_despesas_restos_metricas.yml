version: 2

models:
  - name: fct_despesas_restos_metricas
    description: "Mart de métricas de restos a pagar por portal, entidade e exercício"
    config:
      contract:
        enforced: true
    columns:
      - name: restos_metricas_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | empresa_id | ano)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        description: "Identificador da entidade contábil"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: restos_inscritos
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total inscrito em restos a pagar"
        tests:
          - not_null
      - name: restos_pagos
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total de restos a pagar quitados"
        tests:
          - not_null
      - name: restos_cancelados
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total de restos a pagar cancelados"
        tests:
          - not_null
      - name: saldo_restos
        data_type: numeric
        constraints:
          - type: not_null
        description: "Saldo remanescente de restos a pagar"
        tests:
          - not_null
      - name: divida_mais_antiga_ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano da dívida em restos a pagar mais antiga inscrita"
        tests:
          - not_null

unit_tests:
  - name: test_despesas_restos_metricas_mcasp_e_divida_antiga
    description: "Valida abazimento de cancelamentos (saldo = empenhado - pago - anulacoes) e calculo do ano da divida mais antiga pendente"
    model: fct_despesas_restos_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          # Dívida de 2021 pendente (empenhado 1000 - pago 200 - anulacao 100 = saldo 700)
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, ano_origem: 2021, fonte: "restos_a_pagar", empenhado_liquido: 1000.00, pago: 200.00, valor_anulacoes: 100.00 }
          # Dívida de 2022 quitada (empenhado 500 - pago 500 = saldo 0, não deve definir ano mais antigo)
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, ano_origem: 2022, fonte: "restos_a_pagar", empenhado_liquido: 500.00, pago: 500.00, valor_anulacoes: 0.00 }
          # Linha de fonte 'exercicio' que DEVE ser ignorada
          - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, ano_origem: 2025, fonte: "exercicio", empenhado_liquido: 9999.00, pago: 0.00, valor_anulacoes: 0.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, restos_inscritos: 1500.00, restos_pagos: 700.00, restos_cancelados: 100.00, saldo_restos: 700.00, divida_mais_antiga_ano: 2021 }
