version: 2

models:
  - name: fct_despesas_restos_metricas
    description: Mart de métricas consolidadas de restos a pagar e passivos financeiros.
    config:
      contract:
        enforced: true
    columns:
      - name: restos_metricas_id
        data_type: text
        description: "PK substituta do mart de restos a pagar"
        constraints:
          - type: not_null
      - name: portal_slug
        data_type: text
        description: "Identificador do portal tenant"
        constraints:
          - type: not_null
      - name: empresa_id
        data_type: text
        description: "Identificador do órgão/empresa"
        constraints:
          - type: not_null
      - name: ano
        data_type: integer
        description: "Ano de referência das métricas"
        constraints:
          - type: not_null
      - name: restos_inscritos
        data_type: numeric
        description: "Total de restos a pagar inscritos"
      - name: restos_pagos
        data_type: numeric
        description: "Total de restos a pagar liquidados e pagos"
      - name: restos_cancelados
        data_type: numeric
        description: "Total de restos a pagar anulados ou cancelados"
      - name: saldo_restos
        data_type: numeric
        description: "Saldo pendente acumulado de restos a pagar"
      - name: divida_mais_antiga_ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano da dívida em restos a pagar mais antiga inscrita"
        tests:
          - not_null

unit_tests:
  - name: test_despesas_restos_metricas_mcasp_e_divida_antiga
    description: "Valida abazimento de cancelamentos (saldo = empenhado - pago) e calculo do ano da divida mais antiga pendente"
    model: fct_despesas_restos_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          # Dívida de 2021 pendente em 2025
          - { empenho_id: "E1", portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, fonte: "restos_a_pagar", empenhado: 1000.00, pago: 200.00, valor_anulacoes: 100.00 }
          - { empenho_id: "E1", portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2021, fonte: "exercicio", empenhado: 1000.00, pago: 0.00, valor_anulacoes: 0.00 }
          # Dívida de 2022 quitada em 2025
          - { empenho_id: "E2", portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, fonte: "restos_a_pagar", empenhado: 500.00, pago: 500.00, valor_anulacoes: 0.00 }
          - { empenho_id: "E2", portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2022, fonte: "exercicio", empenhado: 500.00, pago: 500.00, valor_anulacoes: 0.00 }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", empresa_id: "1", ano: 2025, restos_inscritos: 1500.00, restos_pagos: 700.00, restos_cancelados: 100.00, saldo_restos: 800.00, divida_mais_antiga_ano: 2021 }
