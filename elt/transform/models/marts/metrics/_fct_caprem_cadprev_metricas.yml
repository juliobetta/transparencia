version: 2

models:
  - name: fct_caprem_cadprev_metricas
    description: "Mart de acordos de confissão e parcelamento de dívida previdenciária junto ao CAPREM (Elemento 71), filtrados para excluir outras despesas de amortização não relacionadas (ex: multas de INSS/RGPS à Receita Federal que também usam o Elemento 71)"
    config:
      contract:
        enforced: true
    columns:
      - name: caprem_cadprev_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | ano | empenho_id)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: empenho_id
        data_type: text
        description: "Identificador do empenho"
      - name: descricao
        data_type: text
        description: "Histórico/descrição do lançamento, geralmente contendo o número CADPREV"
      - name: data_empenho
        data_type: date
        description: "Data do empenho/lançamento"
      - name: empenhado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total empenhado"
        tests:
          - not_null
      - name: pago
        data_type: numeric
        constraints:
          - type: not_null
        description: "Valor total pago"
        tests:
          - not_null

unit_tests:
  - name: test_caprem_cadprev_metricas_filtro_fornecedor
    description: "Valida que apenas lançamentos do CAPREM (fornecedor ou descrição com CADPREV) são incluídos, excluindo outras despesas de Elemento 71 não relacionadas (ex: multa de INSS à Receita Federal)"
    model: fct_caprem_cadprev_metricas
    given:
      - input: ref('fct_despesas')
        rows:
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenho_id: "E-200", elemento: "71", fornecedor_nome: "CAPREM-CAIXA DE PREVIDENCIA MUNICIPAL", descricao: "PAGAMENTO REFERENTE AO ACORDO DE PARCELAMENTO (CADPREV Nº01065/2025)", data_empenho: "2025-05-04", empenhado_liquido: 100000.00, liquidado: 50000.00, pago: 50000.00, tipo_empenho: "ES", fonte: "exercicio" }
          # Multa de INSS/RGPS à Receita Federal: usa Elemento 71 mas NÃO é dívida do CAPREM, deve ser excluída
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenho_id: "E-201", elemento: "71", fornecedor_nome: "RECEITA FEDERAL", descricao: "PAGAMENTO DE MULTA REFERENTE A DEBITO RELACIONADO A CONTRIBUICAO PREVIDENCIARIA", data_empenho: "2025-01-10", empenhado_liquido: 144369.96, liquidado: 144369.96, pago: 144369.96, tipo_empenho: "ES", fonte: "exercicio" }
          # Descrição com acento diferente (Nº com cedilha/til em CADPREV não se aplica, mas fornecedor com acentuação variada deve casar via unaccent)
          - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenho_id: "E-202", elemento: "71", fornecedor_nome: "CAPREM - CAIXA DE PREVIDÊNCIA MUNICIPAL", descricao: "AMORTIZAÇÃO DE DÍVIDA PREVIDENCIÁRIA", data_empenho: "2025-06-04", empenhado_liquido: 20000.00, liquidado: 20000.00, pago: 20000.00, tipo_empenho: "OR", fonte: "exercicio" }
    expect:
      rows:
        - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenho_id: "E-200", descricao: "PAGAMENTO REFERENTE AO ACORDO DE PARCELAMENTO (CADPREV Nº01065/2025)", data_empenho: "2025-05-04", empenhado: 100000.00, pago: 50000.00 }
        - { portal_slug: "porciuncula_prefeitura", ano: 2025, empenho_id: "E-202", descricao: "AMORTIZAÇÃO DE DÍVIDA PREVIDENCIÁRIA", data_empenho: "2025-06-04", empenhado: 20000.00, pago: 20000.00 }
