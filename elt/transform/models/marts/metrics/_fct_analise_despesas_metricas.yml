version: 2

models:
  - name: fct_analise_despesas_metricas
    description: "Mart de métricas agregadas de análise de despesas por portal, entidade, exercício, órgão, unidade e função"
    config:
      contract:
        enforced: true
    tests:
      - dbt_utils.expression_is_true:
          expression: "total_empenhado >= total_liquidado AND total_liquidado >= total_pago"
          name: analise_despesas_invariante_lrf
    columns:
      - name: analise_despesas_id
        data_type: text
        constraints:
          - type: not_null
        description: "Chave surrogate MD5 (portal_slug | empresa_id | ano | orgao_codigo | unidade_codigo | funcao_codigo)"
        tests:
          - not_null
          - unique
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
        description: "Dimensão de tenant isolada por portal"
        tests:
          - not_null
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
        description: "Identificador da entidade/órgão contábil"
        tests:
          - not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        description: "Ano do exercício fiscal"
        tests:
          - not_null
      - name: orgao_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código do órgão orçamentário"
        tests:
          - not_null
      - name: unidade_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código da unidade orçamentária"
        tests:
          - not_null
      - name: funcao_codigo
        data_type: text
        constraints:
          - type: not_null
        description: "Código da função orçamentária"
        tests:
          - not_null
      - name: total_dotacao_atualizada
        data_type: numeric
        constraints:
          - type: not_null
        description: "Dotação orçamentária atualizada da unidade/função"
        tests:
          - not_null
      - name: total_empenhado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores empenhados no agrupamento"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_liquidado
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores liquidados no agrupamento"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: total_pago
        data_type: numeric
        constraints:
          - type: not_null
        description: "Somatório de valores pagos no agrupamento"
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
