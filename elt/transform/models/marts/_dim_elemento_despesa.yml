version: 2

models:
  - name: dim_elemento_despesa
    description: "Dimensão canônica dos elementos de despesa oficiais (STN/MCASP)"
    config:
      contract:
        enforced: true
    columns:
      - name: elemento_codigo
        data_type: text
        constraints:
          - type: not_null
          - type: primary_key
        tests:
          - not_null
          - unique
      - name: elemento_descricao
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: categoria_macro
        data_type: text
        constraints:
          - type: not_null
        tests:
          - not_null
