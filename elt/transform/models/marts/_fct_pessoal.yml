version: 2

models:
  - name: fct_pessoal
    description: "Fato de pessoal consolidado de todos os portais (sem chave única por linha)"
    config:
      contract:
        enforced: true
    columns:
      - name: portal_slug
        data_type: text
        constraints:
          - type: not_null
      - name: ano
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 2015
              max_value: 2035
      - name: empresa_id
        data_type: text
        constraints:
          - type: not_null
      - name: proventos
        data_type: numeric
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              row_condition: "proventos is not null"
      - name: categoria_funcional
        data_type: text
        description: "Categoria da função do servidor (ex: Efetivos, Contratação por excepcional interesse público, Cargo comissionado extra-quadro, Efetivos ocupantes de cargo comissionado)."
      - name: vinculo
        data_type: text
        description: "Tipo de vínculo jurídico do servidor. Contém identificadores de posições de confiança/chefia como 'FG' (Função Gratificada) e 'CC' (Cargo em Comissão)."
      - name: cargo
        data_type: text
        description: "Nome do cargo exercido pelo servidor (ex: Apoio Urbano, Professor, Assessor, Guarda Municipal)."
      - name: forma_provimento
        data_type: text
        description: "Forma de recrutamento e admissão (ex: CONCURSO PUBLICO, LIVRE PROVIMENTO, TEMPO DETERMINADO, ELEICAO/INDICACAO)."
