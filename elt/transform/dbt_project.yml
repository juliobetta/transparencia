name: "transparencia"
version: "1.0.0"
config-version: 2

profile: "transparencia"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"


vars:
  test_mode: false
  administracao_reference_year: 2025
  administracao_min_valid_year: 2000

on-run-start:
  - "CREATE EXTENSION IF NOT EXISTS unaccent;"
  - "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
  - "CREATE OR REPLACE FUNCTION immutable_unaccent(text) RETURNS text AS $$ SELECT public.unaccent($1) $$ LANGUAGE sql IMMUTABLE PARALLEL SAFE;"

models:
  transparencia:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: "{{ 'view' if var('test_mode', false) else 'table' }}"
