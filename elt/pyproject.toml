[project]
name = "transparencia"
version = "0.14.1"
description = "Transparência fiscal e gestão orçamentária"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "pandas==3.0.5",
    "jinja2==3.1.6",
    "matplotlib==3.11.1",
    "pytest==9.1.1",
    "plotly==6.9.0",
    "sqlmodel==0.0.39",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.3",
    "fpdf2==2.8.8",
    "playwright==1.62.0",
    "pyyaml==6.0.3",
    "dbt-core==1.12.2",
    "dbt-postgres==1.11.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "mypy==2.3.1",
    "vulture==2.16",
    "ruff==0.16.3",
    "testing-postgresql==1.3.0",
    "types-PyYAML==6.0.12.20260815",
]

[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E", "W", "F", "I", "ARG"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"**/__tests__/*.py" = ["ARG"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=analytics"

[tool.vulture]
exclude = ["*__tests__*", "*/tests/*", "*/fixtures/*", "*conftest.py"]
