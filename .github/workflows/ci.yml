name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PostgreSQL
        run: sudo apt-get install -y postgresql postgresql-client

      - name: Install dependencies
        run: pip install uv && uv sync --project elt --all-groups

      - name: Run linting
        run: make check

      - name: Run tests
        run: make test
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        ports:
          - 5544:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Restore packages/db test schema
        run: gunzip -c packages/db/tests/fixtures/schema.sql.gz | psql "$DATABASE_URL"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5544/postgres

      - name: Run tests
        run: make test/ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5544/postgres

      - name: Run build
        run: pnpm build

  migrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install uv && uv sync --project elt

      - name: Run migrations
        run: make migrate/grant
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
